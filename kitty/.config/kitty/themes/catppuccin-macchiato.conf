# Catppuccin Macchiato Theme for Kitty
# To switch themes: edit kitty.conf and change the include line, then save
# Kitty will automatically reload (if you have enabled watch_for_config_changes)

# Base colors
background #181926
foreground #cad3f5
selection_background #5b6078
selection_foreground #cad3f5

# Cursor colors
cursor #f4dbd6
cursor_text_color #24273a

# URL underline color when hovering with mouse
url_color #8aadf4

# Tab bar colors
active_tab_foreground #181926
active_tab_background #c6a0f6
inactive_tab_foreground #cad3f5
inactive_tab_background #1e2030

# Black
color0 #494d64
color8 #5b6078

# Red
color1 #ed8796
color9 #ed8796

