# kitty config for the pve-prod tab in the SUPER+S zellij group (launched from
# hyprland/.config/hypr/modules/scratchpads.lua with `kitty --config`).
#
# Same trick as jjserver.conf: include the normal config, then re-apply the pinned
# server theme AFTER it, so a live theme reload (Noctalia sends SIGUSR1 to kitty)
# keeps this window on the ember palette instead of the wallpaper palette.
# The theme file is written by scripts/server-theme/deploy.sh pve-prod.
include kitty.conf
include themes/server-pve-prod.conf
