# kitty config for the jjserver special-workspace window (launched via
# windowrules.lua with `kitty --config`).
#
# Pull in the normal config, then re-apply the fixed cobalt theme AFTER it. Because
# kitty.conf does `include current-theme.conf` (the wallpaper colors), a live theme
# reload (Noctalia sends SIGUSR1 to kitty) would otherwise repaint this window with
# the wallpaper palette. Re-including cobalt last means a reload re-pins cobalt, so
# the jjserver window stays themed regardless of local theme changes.
include kitty.conf
include themes/server-theme.conf
