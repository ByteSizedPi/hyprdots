# BEGIN_KITTY_FONTS
font_family family="CaskaydiaCove Nerd Font Mono"
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.0

# Enable ligatures
disable_ligatures never

font_features CaskaydiaCoveNFM-Bold +liga +calt
font_features CaskaydiaCoveNFM-BoldItalic +liga +calt
font_features CaskaydiaCoveNFM-Italic +liga +calt
font_features CaskaydiaCoveNFM-Regular +liga +calt

cursor_shape beam
enable_audio_bell no
background_opacity 0.8
background_blur 0
allow_remote_control yes
confirm_os_window_close 0
window_padding_width 8 8
single_window_padding_width -1
single_window_margin_width -1
window_margin_width 0
draw_minimal_borders no
placement_strategy bottom
sync_to_monitor yes

# ============================================================================
# COLOR THEME
# ============================================================================
# To switch themes, change the include path below and save.
# Kitty will automatically reload if watch_for_config_changes is enabled.
# Available themes in ~/.config/kitty/themes/

# include themes/catppuccin-macchiato.conf


# Palette, regenerated by Noctalia on every theme change (gitignored).
# NOT `current-theme.conf` — that's a stale leftover from `kitten themes`, last
# written 2026-07-20 and no longer updated by anything.
include themes/noctalia.conf

# Per-theme NON-colour settings — font size, opacity, padding. Written by
# scripts/desktop-theme/apply.sh from themes/<name>/apps/kitty.conf (a placeholder
# when the theme has none). Wired up in scripts/desktop-theme/apps.conf.
#
# Deliberately last: kitty takes the final value for a key, so anything in here
# overrides the settings above. Edit it live and bank it with
# `scripts/desktop-theme/save.sh <name> --force` — it's captured like the rest.
include theme-extra.conf

# ============================================================================
# KEYBINDINGS
# ============================================================================
# ctrl+shift+t (new_tab) collided with zellij's own tab navigation, creating a
# confusing second layer of "tabs" (kitty OS tabs stacked on zellij tabs).
map ctrl+shift+t no_op
