[general]
# Imports load in listed order, and THE IMPORTING FILE LOADS LAST — the opposite of
# kitty, where a later `include` wins. So anything set directly in this file beats
# every import, and a key can only be themed if this file does NOT set it.
# (man 5 alacritty, "import")
#
# That's why `[window] opacity` is no longer here: it moved to theme-extra.toml so a
# theme can change it. Setting it here again would silently pin it globally.
#
#   themes/noctalia.toml   palette, regenerated by Noctalia on every theme change
#   theme-extra.toml       per-theme non-colour settings, written by
#                          scripts/desktop-theme/apply.sh from
#                          themes/<name>/apps/alacritty.toml, falling back to
#                          themes/_base/apps/alacritty.toml
import = [
    "~/.config/alacritty/themes/noctalia.toml",
    "~/.config/alacritty/theme-extra.toml",
]
