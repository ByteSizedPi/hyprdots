# Omarchy runs Hyprland under uwsm, which exports WAYLAND_DISPLAY before
# graphical-session.target. Tie espanso to that target instead of the packaged
# default.target, so it never starts before the compositor (home needed a 30 s
# wait loop in a custom unit for the same race: docs/problems.md, 2026-10-26).
# Enabled with: systemctl --user add-wants graphical-session.target espanso.service
[Unit]
After=graphical-session.target
PartOf=graphical-session.target
