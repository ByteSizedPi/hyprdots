# Restore INFO logging.
#
# The packaged unit runs `voxtype -q daemon`. Quiet mode drops "Recording
# started", "Recording stopped (Ns)" and "Transcription completed in Ns: ..."
# — the only record of what dictation actually did. The whisper_* and ggml_*
# lines still appear either way; those come from the C library and ignore the
# Rust log level, which makes a quiet daemon look busy while telling you nothing.
#
# Keep this. Diagnosing dictation without it means guessing.
[Service]
ExecStart=
ExecStart=/usr/bin/voxtype daemon
