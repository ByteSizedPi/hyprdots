# Read by the systemd --user environment-d generator at session start, so this
# reaches everything spawned in the graphical session (Hyprland exec-once
# chain, the zellij *server*, etc.) — not just interactive shells that source
# ~/.zshrc. Without it, anything resurrected/execed directly by long-lived
# session processes (e.g. zellij resurrecting a pane and exec'ing "claude"
# straight from its own server env) can't see ~/.local/bin and fails with
# "command not found" even though it works fine when typed in a shell.
# See docs/problems.md → "zellij resurrection: command not found".
PATH=/home/jj/.local/bin:/home/jj/bin:${PATH}
