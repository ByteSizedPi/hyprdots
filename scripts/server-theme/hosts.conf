# Servers that get a pinned theme from scripts/server-theme/deploy.sh.
# One line per server: <label> <ssh target> <palette>
#
#   label    names the local outputs: kitty/.config/kitty/themes/server-<label>.conf
#            and hyprland/.config/hypr/theme/<label>.lua. Also the zellij session
#            name. (Until 2026-10-09 also the kitty --class suffix zellij-<label>
#            in hyprland/.config/hypr/modules/scratchpads.lua.)
#   target   anything ssh accepts, including a ~/.ssh/config alias.
#   palette  a file in noctalia/.config/noctalia/palettes/ without .json.
#
# This file replaced palettes/active (one palette for the one server) on 2026-10-07.
