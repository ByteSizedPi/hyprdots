# Which app configs travel with a theme.
#
# Noctalia already pushes the palette into kitty, zellij, nvim, btop and friends via
# its templates. This file is for the OTHER half — the non-colour settings that make
# a look: font size, padding, opacity, borders.
#
# Format, pipe-separated:
#
#   <app> | <destination> | <reload command>
#
#   <app>          names themes/<name>/apps/<app>.conf, the tracked input
#   <destination>  where apply.sh writes it. ~ , $HOME and $XDG_CONFIG_HOME expand.
#   <reload>       optional; run after writing. Leave blank if the app self-watches.
#
# The destination must be a file the THEME owns exclusively — apply.sh overwrites it
# without asking and save.sh reads it straight back. Never point this at a real
# config file; point it at a dedicated overlay the app includes. For kitty that
# means an `include theme-extra.conf` line at the end of kitty.conf, so its settings
# win over the ones above it.
#
# The tracked input is themes/<name>/apps/<app>.<ext>, where <ext> comes from the
# destination — kitty.conf, alacritty.toml — so a file is named for the format it
# actually is. When a theme ships none, apply.sh falls back to
# themes/_base/apps/<app>.<ext>, and only writes a bare placeholder if that's absent
# too. save.sh does not capture an unmodified fallback, so themes keep inheriting it.
#
# Adding an app is one line here plus an include on the app's side. Two catches:
#
#   1. The app must SUPPORT an include/override file. kitty and alacritty do;
#      zellij's KDL does not, so a per-theme zellij setting would mean owning its
#      whole config — not worth it for a font size.
#   2. Check WHICH SIDE WINS. kitty takes the last value, so the overlay just needs
#      to be included last. Alacritty is the reverse: the importing file loads last
#      and beats its imports, so any key you want themed must be REMOVED from
#      alacritty.toml — see the comment at the top of that file.

kitty     | $XDG_CONFIG_HOME/kitty/theme-extra.conf      | pkill -SIGUSR1 -x kitty
alacritty | $XDG_CONFIG_HOME/alacritty/theme-extra.toml  |
