# Which Noctalia settings belong to a "theme".
#
# Used by scripts/desktop-theme/{save,apply,reset}.sh via scripts/desktop-theme/settings-toml.py to decide
# which keys get snapshotted into themes/<name>/noctalia.toml and which stay put
# as machine/behaviour config. This file is the single source of truth for that
# split — edit it here, not in the scripts.
#
# Syntax: one glob per line, matched against the full dotted key path
# (e.g. "bar.default.border_width"). `*` crosses dots. A leading `!` excludes,
# and exclusions always win. Blank lines and #-comments ignored.
#
# Rule of thumb: if changing it changes how the desktop LOOKS, it's a theme key.
# If it changes what the desktop DOES, or names this machine's hardware, it isn't.

# --- bar: geometry, radii, opacity, fonts (NOT which widgets are on it) ---
bar.*
!bar.*.monitors                 # per-machine monitor assignment

# Which widgets sit on the bar, and where, is personal setup rather than a look:
# adding a widget shouldn't make it vanish the moment you switch themes. This bit
# us with the theme-switcher widget itself, which got captured into comicmono only
# (2026-07-28) — a widget for switching themes that disappears when you switch
# themes. Widget *appearance* is still themed, via the widget.* block below.
!bar.*.start
!bar.*.center
!bar.*.end
!bar.*.capsule_group            # mixed value: capsule fill/opacity/padding AND
                                # `members` (widget ids). One TOML value, so a glob
                                # can't split it — and the layout half is the half
                                # that breaks when it travels, so it wins. Capsule
                                # styling is machine config as a result.

# --- palette / color scheme ---
theme.*
!theme.templates.*              # template WIRING, not look — stripping this
                                # would stop kitty/nvim/gtk themes generating

# --- per-widget appearance (colors, weights, capsules, sizes) ---
widget.*
!widget.*.type                  # widget identity/wiring, not appearance
!widget.*.stat                  # which metric a sysmon widget reads
!widget.*.device                # which audio device a volume widget reads

# --- popups & overlays ---
notification.*
!notification.monitors
!notification.enable_daemon     # behaviour: whether we serve notifications
osd.*
!osd.monitors
!osd.kinds.*                    # behaviour: which OSDs are allowed to appear

# --- desktop dimming behind panels ---
backdrop.*

# --- wallpaper ---
# The wallpaper IS the look here: theme.source = "wallpaper" derives the whole
# palette from it, so a theme that didn't carry its own wallpaper would recolour
# itself the moment you changed the picture.
# Note this deliberately breaks the `!*.monitors` rule used above: for wallpaper,
# the per-monitor table holds the actual image, not a machine assignment, so it's
# captured. Monitor names are this machine's — a theme applied on different
# hardware will simply not match any of them and fall back to wallpaper.default.
wallpaper.*
!wallpaper.directory            # the picker's browse root, a machine path

# --- dock ---
dock.*
!dock.monitors
!dock.pinned                    # personal app list, not a look

# --- shell chrome: borders, radii, shadows, animation feel ---
shell.font_family
shell.app_icon_color
shell.app_icon_colorize
shell.corner_radius_scale
shell.button_borders
shell.card_borders
shell.input_borders
shell.popup_borders
shell.popup_shadows
shell.password_style
shell.animation.*
shell.panel.*
shell.screen_corners.*
shell.shadow.*

# --- launcher layout (grid vs list, categories, icons) ---
# NB the legacy `shell.panel.launcher_*` names were dropped from the schema; the
# live keys are `shell.launcher.*` (migrated 2026-07-27, see docs/problems.md).
shell.launcher.app_grid
shell.launcher.categories
shell.launcher.compact
shell.launcher.show_icons

# --- lockscreen looks (NOT lockscreen.enabled / fingerprint / password policy) ---
lockscreen.blur_intensity
lockscreen.tint_intensity
lockscreen.blurred_desktop
lockscreen.wallpaper
