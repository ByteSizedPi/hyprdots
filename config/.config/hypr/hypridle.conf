general {
    ignore_dbus_inhibit = false # Respect apps that prevent idle (like media players)
    lock_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Turn off display 5 seconds after manual lock
listener {
    timeout = 5
    on-timeout = pidof hyprlock && hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Normal idle: turn off display after 5 minutes
listener {
    timeout = 3600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Lock and turn off display after 10 minutes of idle
listener {
    timeout = 3600
    on-timeout = loginctl lock-session
}