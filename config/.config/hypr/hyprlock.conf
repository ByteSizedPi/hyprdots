general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = false
}

background {
    monitor =
    path = /home/jj/Pictures/Wallpapers/Clearnight.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.7
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Time - Glassy Apple effect with layered shadows
# Bottom shadow layer (darkest)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(0, 0, 0, 0.8)
    font_size = 120
    font_family = JetBrains Mono Bold
    position = 0, 296
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.6)
    shadow_boost = 1.5
}

# Mid shadow layer (for depth)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(0, 0, 0, 0.4)
    font_size = 120
    font_family = JetBrains Mono Bold
    position = 0, 299
    halign = center
    valign = center
}

# Top white layer (main text)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.95)
    font_size = 120
    font_family = JetBrains Mono Bold
    position = 0, 300
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.3)
}

# Date - Glassy effect
# Shadow layer
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(0, 0, 0, 0.5)
    font_size = 28
    font_family = JetBrainsMono NFP
    position = 0, 178
    halign = center
    valign = center
}

# Main text
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, 0.85)
    font_size = 28
    font_family = JetBrainsMono NFP
    position = 0, 180
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.4)
}

# User greeting - Glassy effect with color
# Shadow layer
label {
    monitor =
    text = $USER
    color = rgba(0, 0, 0, 0.6)
    font_size = 32
    font_family = JetBrains Mono Bold
    position = 0, 78
    halign = center
    valign = center
}

# Main text with blue tint
label {
    monitor =
    text = $USER
    color = rgba(138, 173, 244, 0.95)
    font_size = 32
    font_family = JetBrains Mono Bold
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Input field with modern styling
input-field {
    monitor =
    size = 400, 60
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(68, 71, 90, 0.8)
    inner_color = rgba(40, 42, 54, 0.6)
    font_color = rgb(248, 248, 242)

    fade_on_empty = false
    fade_timeout = 1000

    placeholder_text = <span foreground="##f8f8f2aa">Enter Password...</span>
    hide_input = false

    rounding = 15

    check_color = rgba(255, 184, 108, 0.9)
    fail_color = rgba(255, 85, 85, 0.9)

    fail_text = <span foreground="##ff5555">Authentication failed</span>
    fail_transition = 300

    position = 0, -100
    halign = center
    valign = center
}

# Caps lock indicator
label {
    monitor =
    text = cmd[update:500] ~/.config/hypr/scripts/check-caps.sh
    color = rgba(255, 184, 108, 0.9)
    font_size = 14
    font_family = JetBrains Mono
    position = 0, -180
    halign = center
    valign = center
}