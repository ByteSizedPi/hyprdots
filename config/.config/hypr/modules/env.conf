# ==== Environment Variables ====
# Hybrid Intel (iGPU, display) + NVIDIA (dGPU, offload) setup
# Intel Arc = pci-0000:00:02.0 (card1), NVIDIA RTX 500 Ada = pci-0000:01:00.0 (card0)

# AQ_DRM_DEVICES intentionally omitted: aquamarine auto-detection correctly skips
# card0 (NVIDIA, non-KMS) and selects card1 (Intel Arc, KMS). Setting this variable
# breaks greetd/start-hyprland because colons in PCI paths conflict with the colon
# separator aquamarine uses to split the device list.

# Hardware video decode: use Intel VA-API (correct for iGPU-primary setup)
env = LIBVA_DRIVER_NAME,iHD

# NVIDIA direct rendering backend (driver 555+)
env = NVD_BACKEND,direct

# Wayland session
env = XDG_SESSION_TYPE,wayland

# Electron/Chromium apps: prefer native Wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Firefox: native Wayland
env = MOZ_ENABLE_WAYLAND,1

# GTK: prefer Wayland, fall back to X11
env = GDK_BACKEND,wayland,x11,*

# Qt: prefer Wayland, fall back to xcb
env = QT_QPA_PLATFORM,wayland;xcb

# Qt theming via qt6ct (Hyprland-only — keeps KDE/Plasma sessions unaffected)
env = QT_QPA_PLATFORMTHEME,qt6ct
