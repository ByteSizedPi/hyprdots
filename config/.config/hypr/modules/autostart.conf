# exec-once = uwsm app -- kanshi  # removed: using native Hyprland monitor rules
# exec-once = uwsm app -- waybar
# exec-once = uwsm app -- hyprpaper 
exec-once = uwsm app -- dms run
exec-once = uwsm app -- hypridle
# exec-once = uwsm app -- hyprsunset -t 4500
# exec-once = uwsm app -- swaync
# exec-once = uwsm app -- /home/jj/.local/bin/hyprsession
# exec-once = uwsm app -- sass --watch /home/jj/dotfiles/config/.config/waybar/style.scss:/home/jj/dotfiles/config/.config/waybar/style.css

# exec-once = [workspace special:menu silent] kitty
exec-once = [workspace special:menu silent] kitty zsh -li -c "zellij attach main --create"

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================

# Cursor settings
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Desktop environment identification
env = XDG_CURRENT_DESKTOP,Hyprland:GNOME
env = XDG_SESSION_CLASS,user

# Qt settings
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORM,wayland

# Wayland backend for various toolkits
env = MOZ_ENABLE_WAYLAND,1
env = GDK_BACKEND,wayland
env = CLUTTER_BACKEND,wayland
env = SDL_VIDEODRIVER,wayland

# Java applications on tiling window managers
env = _JAVA_AWT_WM_NONREPARENTING,1
