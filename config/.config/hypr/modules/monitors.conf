# monitor = desc:<description>, <resolution@refreshRate>, <position>, <scale>
# Get descriptions with: hyprctl monitors | grep description

env = __GL_SYNC_TO_VBLANK,1

# ── Office: Samsung LS27C31x (left, primary) + laptop (right) ─────────────────
monitor = desc:Samsung Electric Company LS27C31x H9JX501228, 1920x1080@60, 0x0, 1
monitor = desc:BOE 0x0B8E, 1920x1080@60, 1920x0, 1

# ── Home: AOC 24G2W1G3- (verify desc when connected) ─────────────────────────
# monitor = desc:AOC 24G2W1G3- AYAM91A000341, 1920x1080@144, 1920x0, 1

# ── TV: Samsung 4K (verify desc when connected) ───────────────────────────────
# monitor = desc:Samsung Electric Company SAMSUNG 0x01000E00, 4096x2160@60, 0x0, 2

# ── Home: Hisense 4K TV (~53") ───────────────────────────────────────────────
monitor = desc:Hisense Electric Co. Ltd. HISENSE 0x00000001, 3840x2160@60, auto, 2

# ── Fallback for any unrecognized monitor ─────────────────────────────────────
monitor = , preferred, auto, 1
