windowrule {
    name = net-man

    match:initial_title = Network Manager

    float = on
    size = 800 600
    move = (monitor_w-window_w-5) (42)
}

windowrule {
    name = ssh-border

    match:title = ^jjserver.*
    match:class = kitty
    
    border_size = 2
    rounding = 8
    border_color  = rgba(8FF586dd) rgba(8FF586dd)
}

windowrule {
    name = yazi-border
    
    match:title = ^Yazi.*
    match:class = kitty

    border_size = 2
    rounding = 8
    border_color  = rgba(8aadf4ff) rgba(8aadf4ff)
}

windowrule = xray on, match:workspace special:menu
