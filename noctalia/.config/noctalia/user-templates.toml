[theme.templates.user.zellij]
input_path = "~/.config/noctalia/templates/zellij-theme.kdl"
output_path = "~/.config/zellij/themes/noctalia.kdl"
post_hook = "bash ~/.config/noctalia/scripts/zellij-reload.sh"

[theme.templates.user.nvim]
input_path = "~/.config/noctalia/templates/nvim-theme.lua"
output_path = "$XDG_CONFIG_HOME/nvim/lua/noctalia-theme.lua"
post_hook = "bash ~/.config/noctalia/scripts/nvim-theme-apply.sh"

[theme.templates.user.zsh]
input_path = "~/.config/noctalia/templates/zsh-theme.zsh"
output_path = "$XDG_CONFIG_HOME/zsh/noctalia-theme.zsh"

# [theme.templates.user.hyprland-windowrules]
# input_path = "~/.config/noctalia/templates/hyprland-windowrules.lua"
# output_path = "~/.config/hypr/noctalia-windowrules.lua"

# Linux console palette for the tuigreet greeter on VT1: 16 lines of RRGGBB,
# slots 0-15 in ANSI order (0 = background, 7 = default text). The greetd
# wrapper /usr/local/bin/tuigreet-themed loads it into VT1 before tuigreet
# starts. The greetd user cannot read /home/jj, so the output goes to a
# jj-owned dir outside $HOME (see SYSTEM.md -> "greetd: noctalia colors").
[theme.templates.user.greetd]
input_path = "~/.config/noctalia/templates/greetd-palette"
output_path = "/var/lib/greetd-theme/palette"

# Beeper Desktop reads custom.css from its userData dir at start. Beeper has no
# working file watcher (4.2.985), so no post_hook can reload it: type
# "Reload custom CSS" in the Beeper command bar, or restart Beeper.
[theme.templates.user.beeper]
input_path = "~/.config/noctalia/templates/beeper.css"
output_path = "~/.config/BeeperTexts/custom.css"
