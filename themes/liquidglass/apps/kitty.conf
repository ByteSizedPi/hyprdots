# liquidglass — kitty settings.
#
# Installed to ~/.config/kitty/theme-extra.conf by scripts/desktop-theme/apply.sh,
# included LAST from kitty.conf so these win over the defaults above it.
# Edit the installed copy live, then bank it:
#   scripts/desktop-theme/save.sh liquidglass --force

# More transparent than the flat themes — this is what the glass shows through.
# Below ~0.55 the text starts fighting the wallpaper.
background_opacity 0.62

# Glass edges need room to be seen; matches the wider Hyprland gaps.
window_padding_width 14 14
